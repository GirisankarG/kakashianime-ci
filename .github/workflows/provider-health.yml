# The daily health run. This public repository holds only this file and a
# mail script; every check runs from a private checkout, so nothing here
# names the site, its sources or its players.
#
# One script stays public on purpose: notify.py, standard library only. If
# the private checkout fails, every step that needs it fails too, and the
# step whose job is to say so must not be among them. A sibling project lost
# a day to exactly that on 13 Sep: the private checkout failed, every later
# step was skipped, the mail step with them, and nobody was told.
name: health

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # Absolute, because the checks run inside src/ and the cache and the
      # catch-all look at the workspace root.
      ALERT_STATE: ${{ github.workspace }}/alert-state.json
      ALERTS_SENT: ${{ github.workspace }}/alerts.sent
      NOTIFY_PRODUCT: ${{ secrets.NOTIFY_PRODUCT }}
      NOTIFY_SITE: ${{ secrets.NOTIFY_SITE }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Says in one sentence which secret is missing. A missing secret prints
      # as nothing in a step's inputs, and a sibling project spent nine days
      # reading the resulting checkout error as something else.
      - name: Can this run reach the code and tell anyone what it finds
        continue-on-error: true
        env:
          DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          CODE_REPO: ${{ secrets.CODE_REPO }}
          SOURCE_HOSTS: ${{ secrets.SOURCE_HOSTS }}
        run: |
          missing=""
          for v in DEPLOY_KEY CODE_REPO RESEND_API_KEY ALERT_EMAIL EMAIL_FROM NOTIFY_PRODUCT NOTIFY_SITE SOURCE_HOSTS; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::secret(s) not set:$missing"
            exit 1
          fi
          echo "secrets present"

      - name: The code
        uses: actions/checkout@v4
        with:
          # The repository name is a secret as well: it names the site
          # as plainly as the URL does.
          repository: ${{ secrets.CODE_REPO }}
          ref: main
          path: src
          ssh-key: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
          # Only what the checks read. The catalogue is not tracked and the
          # parts files are large; none of the checks below need them.
          sparse-checkout: |
            scripts/measure
            scrapers/universal.py
            scrapers/__init__.py
            data/provider_overrides.json
            data/unique_titles.json
            data/seeds.json
          sparse-checkout-cone-mode: false

      - name: What has already been mailed
        uses: actions/cache@v4
        with:
          path: alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Every provider, three popular titles, judged by the video element
        timeout-minutes: 38
        working-directory: src
        run: bash scripts/measure/guard.sh provider-health python -u scripts/measure/provider_health.py --json health.json --rank rank.json

      - if: always() && hashFiles('src/rank.json') != ''
        name: Publish today's rank for player.js
        working-directory: src
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: pip install boto3 && bash scripts/measure/guard.sh provider-rank python scripts/measure/publish_rank.py rank.json

      - if: always()
        name: Can a visitor watch what aired last night
        working-directory: src
        run: bash scripts/measure/guard.sh airing-lag python scripts/measure/airing_lag.py --titles 25 --site "$NOTIFY_SITE"

      - if: always()
        name: Does the live site work for a visitor
        working-directory: src
        env:
          SOURCE_HOSTS: ${{ secrets.SOURCE_HOSTS }}
        run: bash scripts/measure/guard.sh live-site python scripts/measure/live_canaries.py --base "$NOTIFY_SITE"

      - if: always()
        name: Has the daily pipeline run recently
        working-directory: src
        run: bash scripts/measure/guard.sh nightly-watchdog python scripts/measure/staleness.py --site "$NOTIFY_SITE"

      # Runs from the PUBLIC copy at the workspace root, so it still works
      # when the private checkout is what failed.
      - if: failure() && hashFiles('alerts.sent') == ''
        name: The run failed and no check managed to say why
        run: python notify.py --check health-run "the run failed before any check could report; open the run"
